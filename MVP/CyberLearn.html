<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182947"><title>CyberLearn · Campus Quest</title><style>:root{--nav:#182947;--ink:#142d4c;--muted:#536783;--bg:#f3f6fa;--line:#d2dce7;--blue:#154f88;--teal:#0a6d67;--lime:#c6f3a6;--warn:#8b441e}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.52 system-ui,'Segoe UI',Arial,sans-serif}button,select,input,textarea{font:inherit}button,select,label.pick,input[type=checkbox]{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #d38c17;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--blue)}header{background:var(--nav);color:white}.wrap{max-width:1130px;margin:auto;padding:0 28px}.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-top:15px;padding-bottom:15px}.logo{font-size:21px;font-weight:800;letter-spacing:-1px;white-space:nowrap}.sig{display:inline-grid;place-items:center;color:#153f45;background:var(--lime);width:35px;height:35px;border-radius:11px;margin-right:8px;font-size:21px}.top nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}.navbtn{background:transparent;border:0;border-radius:9px;color:#dde7f8;padding:8px 12px;font-weight:650;font-size:14px}.navbtn[aria-current=page],.navbtn:hover{background:#304564;color:white}.top select{background:#243955;color:white;border:1px solid #6580a0;padding:7px;border-radius:8px}.skip{position:fixed;top:-70px;z-index:30;background:white;padding:10px}.skip:focus{top:4px}.space{padding-top:27px;padding-bottom:55px}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,4vw,46px);line-height:1.1;letter-spacing:-.045em}h2{font-size:23px;line-height:1.2;letter-spacing:-.025em}h3{font-size:17px;line-height:1.35}.sub,.note{color:var(--muted)}.note{font-size:13px}.sub{margin-top:9px}.ey{font:700 12px/1.3 ui-monospace,Consolas,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin-bottom:11px}.hero{position:relative;overflow:hidden;border-radius:24px;background:#153c51;color:white;display:grid;grid-template-columns:1.4fr .8fr;align-items:center;padding:34px 36px;min-height:203px}.hero .ey{color:var(--lime)}.hero p{color:#d0e7e9;margin-top:12px;max-width:600px}.art{width:100%;max-height:170px}.grid,.two{display:grid;grid-template-columns:1.2fr .8fr;align-items:start;gap:18px;margin-top:18px}.two{grid-template-columns:1fr 1fr}.box,.panel{border:1px solid var(--line);background:white;border-radius:16px;padding:23px}.box+.box,.gap{margin-top:17px}.row,.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tools{justify-content:flex-start}.pill,.tag{display:inline-block;font-size:12px;font-weight:700;background:#ebf2f7;color:#244564;padding:5px 9px;border-radius:20px}.tag{margin:4px 4px 0 0;background:#e8f4ef;color:#265b49}.btn{background:var(--blue);color:white;border:1px solid transparent;border-radius:9px;padding:10px 15px;min-height:42px;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.alt{background:white;border-color:var(--line);color:var(--ink)}.btn.bad{background:#fff3ef;border-color:#edcec4;color:#812e18}.btn:hover{filter:brightness(.95)}.roles,.choices{display:grid;gap:8px;margin:12px 0 18px}.pick{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fafcfe}.pick:has(:checked){border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:#eef6ff}.pick input{margin:5px 0 0;accent-color:var(--blue)}.pick small{display:block;color:var(--muted);font-size:13px}.code,textarea,.field{display:block;width:100%;max-width:100%;border:1px solid #b6c4d3;border-radius:8px;padding:9px 11px;background:white;color:var(--ink)}.code{max-width:260px}.lab,legend{font-weight:700;font-size:14px}fieldset{border:0;margin:0;padding:0;min-width:0}.route{list-style:none;padding:0;margin:15px 0 0;display:grid;gap:15px}.route li{display:flex;gap:14px;align-items:start}.num{display:grid;place-items:center;flex-shrink:0;font:700 14px ui-monospace,monospace;height:33px;width:33px;border-radius:9px;background:#edf2fa;color:var(--blue)}.route b{display:block}.route small{color:var(--muted)}.mapline{display:flex;gap:5px;margin:18px 0}.mapline i{height:7px;border-radius:6px;background:#d9e3ee;flex:1}.mapline .on{background:var(--teal)}.course{max-width:820px;margin:0 auto}.mail{background:#fafbfe;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:17px 0}.mail .cap{background:#ebf0f8;color:#425a76;padding:8px 15px;font-size:12px;letter-spacing:.055em}.mail .body{padding:19px}.mail .body p{margin-top:9px}.context{border-left:3px solid #80b7bd;padding:8px 14px;background:#f1f8f8;margin:15px 0;font-size:14px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 17px}.chips .pick{padding:8px 13px}.msg{background:#edf7f0;color:#24563b;padding:13px 15px;border-radius:9px;margin:12px 0}.msg.warm{background:#fff4e5;color:#734511}.msg.info{background:#eaf2fb;color:#294d70}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}.metric{min-width:0;background:white;border:1px solid var(--line);padding:15px;border-radius:12px}.metric span,.metric small{display:block;color:var(--muted);font-size:13px}.metric b{display:block;font:750 25px/1.3 system-ui;margin:6px 0;color:var(--ink)}.tabwrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}.tiny{border:0;background:#edf3fa;color:var(--blue);font-weight:650;border-radius:8px;padding:6px 9px}details{border:1px solid var(--line);border-radius:9px;margin:9px 0;background:white;padding:11px 13px}summary{cursor:pointer;font-weight:600}details p{margin:7px 0;font-size:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:92vw;z-index:20;color:white;background:var(--nav);padding:12px 18px;border-radius:10px;box-shadow:0 4px 18px #1333}.toast:empty{display:none}.foot{margin-top:25px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.ring{border:3px solid #66d0ae;color:#b6f8d4;border-radius:50%;width:90px;height:90px;display:grid;place-items:center;text-align:center;font-weight:750}.hint{background:#fff6db;border-radius:8px;padding:12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}#main:focus{outline:0}hr{border:none;border-top:1px solid var(--line);margin:18px 0}@media(max-width:750px){.wrap{padding-left:15px;padding-right:15px}.top{gap:8px}.top nav{order:3;flex-basis:100%}.top select{margin-left:auto}.navbtn{padding:8px;font-size:13px}.grid,.two{grid-template-columns:1fr}.hero{padding:23px;grid-template-columns:1fr}.art{position:absolute;opacity:.09;right:-25px;width:200px;pointer-events:none}.hero>div{z-index:1}.box,.panel{padding:17px}.split{grid-template-columns:1fr}.btn{font-size:14px}.space{padding-top:17px}.metrics{grid-template-columns:1fr 1fr}.ring{display:none}}
@media print{header,.foot,.tools,.skip,.toast,button{display:none!important}.hero,.box{break-inside:auto;background:white;color:black;border:none}main{max-width:none}.ring,.hero .art{display:none}.hero p,.hero .ey{color:black}.metrics{grid-template-columns:repeat(4,1fr)}details{break-inside:avoid}}</style></head><body><a href="#main" class="skip">К содержимому</a><header id="header"></header><main class="wrap space" id="main" tabindex="-1"></main><div id="toast" class="toast" role="status"></div><noscript>Включите JavaScript · JavaScript қосыңыз · Enable JavaScript</noscript><script>const BANK=[{"id":"b1","pool":"shared","risk":true,"key":1,"text":{"en":{"subject":"Your staff account expires today","sender":"Service Desk <help@campus-access.example>","context":"You did not request an account change. Your usual portal is staff.campus.example.","body":"We need to confirm your account today. Use campus-access.example/verify to continue working.","options":["Use the link because the message says Service Desk.","Open your saved staff portal and contact IT through the usual channel.","Reply with your account details."],"explanation":"A familiar display name does not establish who sent a message. Verify an unexpected account request through a route you already trust."},"ru":{"subject":"Срок действия рабочего аккаунта истекает сегодня","sender":"Служба поддержки <help@campus-access.example>","context":"Вы не запрашивали изменение аккаунта. Ваш привычный портал — staff.campus.example.","body":"Сегодня необходимо подтвердить ваш аккаунт. Чтобы продолжить работу, перейдите на campus-access.example/verify.","options":["Открыть ссылку: ведь отправитель указан как служба поддержки.","Открыть сохранённый рабочий портал и связаться с IT-службой привычным способом.","Отправить данные своего аккаунта в ответном письме."],"explanation":"Знакомое имя отправителя не подтверждает его личность. Неожиданный запрос об аккаунте нужно проверить через уже известный вам канал связи."},"kk":{"subject":"Жұмыс тіркелгіңіздің мерзімі бүгін аяқталады","sender":"Қолдау қызметі <help@campus-access.example>","context":"Сіз тіркелгіні өзгертуді сұраған жоқсыз. Әдеттегі порталыңыз — staff.campus.example.","body":"Бүгін тіркелгіңізді растау қажет. Жұмысты жалғастыру үшін campus-access.example/verify мекенжайына өтіңіз.","options":["Сілтемені ашу: жіберуші қолдау қызметі деп көрсетілген.","Сақталған жұмыс порталын ашып, IT қызметіне әдеттегі арна арқылы хабарласу.","Жауап хатпен тіркелгі деректерін жіберу."],"explanation":"Жіберушінің таныс атауы оның кім екенін растамайды. Тіркелгіге қатысты күтпеген сұрауды бұрыннан сенетін байланыс арнасы арқылы тексеріңіз."}}},{"id":"b2","pool":"shared","risk":false,"key":2,"text":{"en":{"subject":"Reminder: teaching workshop","sender":"Training Office <learning@campus.example>","context":"You registered for this workshop yesterday in your saved staff portal.","body":"Your workshop is tomorrow at 10:00. Details are in the staff portal. No reply or account details are required.","options":["Report it only because it is an email.","Reply with your password to confirm your place.","Check the booking in your saved portal and attend if the details match."],"explanation":"The reminder matches an action you took and asks for no secret information. Check independently rather than treating every message as an attack."},"ru":{"subject":"Напоминание: семинар для преподавателей","sender":"Отдел обучения <learning@campus.example>","context":"Вчера вы зарегистрировались на этот семинар через сохранённый рабочий портал.","body":"Ваш семинар состоится завтра в 10:00. Подробности — на рабочем портале. Ответ и данные аккаунта не требуются.","options":["Сообщить о фишинге только потому, что это электронное письмо.","Отправить пароль в ответ, чтобы подтвердить участие.","Проверить запись через сохранённый портал и прийти, если данные совпадают."],"explanation":"Напоминание соответствует вашему действию и не запрашивает секретную информацию. Проверяйте сведения независимо, а не считайте любое письмо атакой."},"kk":{"subject":"Еске салу: оқытушыларға арналған семинар","sender":"Оқыту бөлімі <learning@campus.example>","context":"Сіз кеше осы семинарға сақталған жұмыс порталы арқылы тіркелдіңіз.","body":"Семинарыңыз ертең сағат 10:00-де өтеді. Толық ақпарат жұмыс порталында бар. Жауап беру немесе тіркелгі деректерін жіберу қажет емес.","options":["Электрондық хат болғаны үшін ғана оны фишинг деп хабарлау.","Қатысуды растау үшін жауап хатпен құпиясөз жіберу.","Сақталған порталдан тіркеуді тексеріп, мәліметтер сәйкес келсе қатысу."],"explanation":"Еске салу сіз жасаған әрекетке сәйкес келеді және құпия ақпарат сұрамайды. Әр хатты шабуыл деп қабылдамай, мәліметтерді бөлек тексеріңіз."}}},{"id":"b3","pool":"shared","risk":true,"key":0,"text":{"en":{"subject":"A quick favour from the head of department","sender":"Department Head <head@campus.example>","context":"This request is unusual. You have a saved phone number for the head of department.","body":"I am in a meeting. Buy gift cards now and send the codes to this email. Please do not call.","options":["Confirm the unusual request using the saved phone number before doing anything.","Buy the cards because the sender address looks familiar.","Send the codes first and confirm later."],"explanation":"Even a familiar account may be misused. Unusual purchases and pressure not to verify deserve an independent check."},"ru":{"subject":"Небольшая просьба от заведующего кафедрой","sender":"Заведующий кафедрой <head@campus.example>","context":"Просьба необычная. У вас есть сохранённый номер телефона заведующего кафедрой.","body":"Я на совещании. Срочно купите подарочные карты и отправьте коды на эту почту. Пожалуйста, не звоните.","options":["Прежде чем действовать, подтвердить необычную просьбу по сохранённому номеру телефона.","Купить карты, потому что адрес отправителя выглядит знакомым.","Сначала отправить коды, а потом уточнить просьбу."],"explanation":"Даже знакомый аккаунт может использоваться посторонним. Необычная покупка и просьба не проверять запрос требуют отдельного подтверждения."},"kk":{"subject":"Кафедра меңгерушісінің шағын өтініші","sender":"Кафедра меңгерушісі <head@campus.example>","context":"Бұл — әдеттен тыс өтініш. Кафедра меңгерушісінің телефон нөмірі сізде сақталған.","body":"Мен жиналыстамын. Қазір сыйлық карталарын сатып алып, кодтарын осы поштаға жіберіңіз. Қоңырау шалмауыңызды сұраймын.","options":["Әрекет етпес бұрын, сақталған телефон нөмірі арқылы ерекше өтінішті растау.","Жіберушінің мекенжайы таныс көрінгендіктен карталарды сатып алу.","Алдымен кодтарды жіберіп, кейін нақтылау."],"explanation":"Таныс тіркелгіні де бөтен адам пайдалануы мүмкін. Әдеттен тыс сатып алу және тексермеуге шақыру сұрауды бөлек растауды қажет етеді."}}},{"id":"t1","pool":"teaching","risk":true,"key":1,"text":{"en":{"subject":"Updated marks sheet","sender":"Shared Files <files@campus-docs.example>","context":"Your department normally shares marks through its approved learning portal.","body":"A new marks sheet is ready. Sign in at campus-docs.example/grades to review it today.","options":["Enter your university password on the page.","Open the approved learning portal separately and check with the department.","Forward the link to all students."],"explanation":"Check an unexpected grade file in the approved system. Do not treat a plausible title or university wording as proof."},"ru":{"subject":"Обновлённая ведомость оценок","sender":"Общие файлы <files@campus-docs.example>","context":"Ваша кафедра обычно передаёт ведомости через утверждённый учебный портал.","body":"Новая ведомость готова. Войдите на campus-docs.example/grades, чтобы проверить её сегодня.","options":["Ввести университетский пароль на указанной странице.","Самостоятельно открыть утверждённый учебный портал и уточнить информацию на кафедре.","Переслать ссылку всем студентам."],"explanation":"Неожиданный файл с оценками проверяйте в утверждённой системе. Правдоподобное название и университетская лексика не подтверждают подлинность письма."},"kk":{"subject":"Жаңартылған бағалар тізімі","sender":"Ортақ файлдар <files@campus-docs.example>","context":"Кафедраңыз бағалар тізімін әдетте бекітілген оқу порталы арқылы бөліседі.","body":"Жаңа бағалар тізімі дайын. Оны бүгін тексеру үшін campus-docs.example/grades мекенжайына кіріңіз.","options":["Көрсетілген бетке университет құпиясөзін енгізу.","Бекітілген оқу порталын бөлек ашып, кафедрадан нақтылау.","Сілтемені барлық студентке жіберу."],"explanation":"Күтпеген бағалар файлын бекітілген жүйеден тексеріңіз. Шындыққа ұқсас тақырып немесе университетке тән сөздер хаттың түпнұсқалығын дәлелдемейді."}}},{"id":"t2","pool":"teaching","risk":false,"key":2,"text":{"en":{"subject":"Student asks for deadline confirmation","sender":"Course Student <learner@campus.example>","context":"The question refers to your current course and requests no personal data or new link.","body":"Could you confirm whether our coursework deadline is Friday? I can also see the date in the course portal.","options":["Report every student question as phishing.","Ask the student to send an account password.","Check the published deadline and answer through your normal course channel."],"explanation":"An ordinary course question can be handled through the familiar teaching system. Verification is not the same as rejecting all messages."},"ru":{"subject":"Студент уточняет срок сдачи","sender":"Студент курса <learner@campus.example>","context":"Вопрос относится к вашему текущему курсу. В письме нет новой ссылки или запроса личных данных.","body":"Подскажите, пожалуйста, срок сдачи курсовой работы — в пятницу? Я также могу посмотреть дату на портале курса.","options":["Считать любой вопрос от студента фишингом.","Попросить студента прислать пароль от аккаунта.","Проверить опубликованный срок и ответить через обычный канал общения по курсу."],"explanation":"Обычный вопрос по курсу можно решить через знакомую учебную систему. Проверять сообщения — не значит отклонять их все."},"kk":{"subject":"Студент тапсыру мерзімін нақтылайды","sender":"Курс студенті <learner@campus.example>","context":"Сұрақ қазіргі курсыңызға қатысты. Хатта жаңа сілтеме немесе жеке деректерді сұрау жоқ.","body":"Курстық жұмысты тапсыру мерзімі жұма күні ме? Күнін курс порталынан да қарай аламын.","options":["Студенттің әр сұрағын фишинг деп хабарлау.","Студенттен тіркелгі құпиясөзін жіберуді сұрау.","Жарияланған мерзімді тексеріп, курстың әдеттегі байланыс арнасы арқылы жауап беру."],"explanation":"Курс туралы қалыпты сұрақты таныс оқу жүйесі арқылы шешуге болады. Хаттарды тексеру олардың бәрін қабылдамау дегенді білдірмейді."}}},{"id":"t3","pool":"teaching","risk":true,"key":1,"text":{"en":{"subject":"Share the class contact list","sender":"Visiting Lecturer <guest@external-college.example>","context":"No data-sharing arrangement has been confirmed for this guest.","body":"Please send the full class contact list to my private email so I can organise a session.","options":["Send the list because the purpose sounds educational.","Verify the request and use the authorised data-sharing process.","Post the list in the group chat instead."],"explanation":"A plausible purpose does not authorise releasing student information. Verify who needs it and follow the institution’s approved process."},"ru":{"subject":"Пришлите контакты студентов группы","sender":"Приглашённый преподаватель <guest@external-college.example>","context":"Передача данных этому приглашённому преподавателю пока не согласована.","body":"Пришлите полный список контактов группы на мою личную почту, чтобы я смог организовать занятие.","options":["Отправить список: цель ведь связана с обучением.","Проверить запрос и действовать по утверждённому порядку передачи данных.","Вместо этого опубликовать список в групповом чате."],"explanation":"Правдоподобная цель не даёт разрешения передавать данные студентов. Уточните, кому они нужны, и соблюдайте утверждённый порядок организации."},"kk":{"subject":"Топ студенттерінің байланыс деректерін жіберіңіз","sender":"Шақырылған оқытушы <guest@external-college.example>","context":"Бұл шақырылған оқытушыға деректерді беру әлі келісілмеген.","body":"Сабақ ұйымдастыру үшін топтың толық байланыс тізімін жеке поштама жіберіңіз.","options":["Мақсаты оқу болғандықтан тізімді жіберу.","Сұрауды тексеріп, деректерді берудің бекітілген тәртібін қолдану.","Оның орнына тізімді топ чатына жариялау."],"explanation":"Сенімді көрінетін мақсат студент деректерін беруге рұқсат болып саналмайды. Деректер кімге қажет екенін тексеріп, ұйымның бекітілген тәртібін ұстаныңыз."}}},{"id":"a1","pool":"admissions","risk":true,"key":0,"text":{"en":{"subject":"Urgent applicant record check","sender":"Admissions Review <review@campus-review.example>","context":"Applicant records are handled in your approved admissions portal.","body":"Download the applicant list from campus-review.example and confirm each passport number by reply.","options":["Verify with the admissions team through the approved portal.","Reply with the applicant data immediately.","Forward the request to applicants."],"explanation":"An unfamiliar review request is not permission to disclose applicant details. Use the established admissions workflow."},"ru":{"subject":"Срочная проверка данных абитуриентов","sender":"Проверка приёма <review@campus-review.example>","context":"Данные абитуриентов обрабатываются через утверждённый портал приёмной комиссии.","body":"Скачайте список абитуриентов с campus-review.example и подтвердите каждый номер паспорта ответным письмом.","options":["Уточнить запрос у приёмной комиссии через утверждённый портал.","Немедленно отправить данные абитуриентов в ответ.","Переслать запрос абитуриентам."],"explanation":"Неожиданный запрос на проверку не разрешает раскрывать сведения об абитуриентах. Используйте установленный рабочий процесс приёмной комиссии."},"kk":{"subject":"Талапкерлер деректерін шұғыл тексеру","sender":"Қабылдауды тексеру бөлімі <review@campus-review.example>","context":"Талапкерлердің деректері қабылдау комиссиясының бекітілген порталында өңделеді.","body":"Талапкерлер тізімін campus-review.example сайтынан жүктеп алып, әр төлқұжат нөмірін жауап хатпен растаңыз.","options":["Сұрауды қабылдау комиссиясынан бекітілген портал арқылы нақтылау.","Талапкерлердің деректерін бірден жауап хатпен жіберу.","Сұрауды талапкерлерге қайта жіберу."],"explanation":"Күтпеген тексеру сұрауы талапкер деректерін ашуға рұқсат бермейді. Қабылдау комиссиясының қалыптасқан жұмыс тәртібін пайдаланыңыз."}}},{"id":"a2","pool":"admissions","risk":false,"key":1,"text":{"en":{"subject":"Tomorrow’s reception rota","sender":"Administration <admin@campus.example>","context":"You agreed to this rota yesterday; the message contains no attachment or sign-in link.","body":"Your reception shift starts at 09:00 tomorrow. The rota is available in the usual staff portal.","options":["Report it solely because it mentions a time.","Check the rota through the saved staff portal.","Reply with a one-time login code."],"explanation":"An expected rota reminder can be checked normally. The safest choice uses the usual system without supplying secrets."},"ru":{"subject":"Завтрашний график работы приёмной","sender":"Администрация <admin@campus.example>","context":"Вчера вы согласовали этот график. В письме нет вложений или ссылки для входа.","body":"Ваша смена в приёмной начинается завтра в 09:00. График доступен на привычном рабочем портале.","options":["Сообщить о фишинге только потому, что в письме указано время.","Проверить график через сохранённый рабочий портал.","Отправить одноразовый код входа ответным письмом."],"explanation":"Ожидаемое напоминание о графике можно проверить обычным способом. Безопасное действие — использовать знакомую систему без передачи секретных данных."},"kk":{"subject":"Қабылдау бөлмесінің ертеңгі кестесі","sender":"Әкімшілік <admin@campus.example>","context":"Сіз бұл кестені кеше келістіңіз. Хатта тіркеме немесе кіру сілтемесі жоқ.","body":"Қабылдау бөлмесіндегі ауысымыңыз ертең сағат 09:00-де басталады. Кесте әдеттегі жұмыс порталында бар.","options":["Уақыт көрсетілгені үшін ғана хатты фишинг деп хабарлау.","Кестені сақталған жұмыс порталынан тексеру.","Жауап хатпен бір реттік кіру кодын жіберу."],"explanation":"Күтілген кесте туралы еске салуды әдеттегідей тексеруге болады. Қауіпсіз әрекет — құпия мәліметтерді жібермей, таныс жүйені пайдалану."}}},{"id":"a3","pool":"admissions","risk":true,"key":2,"text":{"en":{"subject":"Install this document viewer","sender":"IT Update <update@campus.example>","context":"No software change was announced. Your IT team provides software through an approved catalogue.","body":"A new viewer is required. Install the attached program and ignore any security warning so you can open applicant documents.","options":["Install it because it appears to come from IT.","Ask a colleague to install it first.","Do not install it; verify through your known IT support channel."],"explanation":"A familiar sender is not enough to approve software. Requests to ignore security warnings need separate verification."},"ru":{"subject":"Установите эту программу для просмотра документов","sender":"Обновление IT <update@campus.example>","context":"Об изменении программ не сообщалось. IT-служба предоставляет программы через утверждённый каталог.","body":"Для просмотра документов абитуриентов нужна новая программа. Установите вложенный файл и проигнорируйте предупреждения безопасности.","options":["Установить программу: письмо выглядит как сообщение IT-службы.","Попросить коллегу установить её первым.","Не устанавливать программу; проверить запрос через известный канал IT-поддержки."],"explanation":"Знакомое имя отправителя не означает разрешение на установку программы. Просьбу проигнорировать предупреждения безопасности нужно проверить отдельно."},"kk":{"subject":"Құжаттарды қарауға арналған осы бағдарламаны орнатыңыз","sender":"IT жаңартуы <update@campus.example>","context":"Бағдарламаларды өзгерту туралы хабарланбаған. IT қызметі бағдарламаларды бекітілген каталог арқылы ұсынады.","body":"Талапкерлердің құжаттарын ашу үшін жаңа бағдарлама керек. Тіркелген бағдарламаны орнатып, қауіпсіздік ескертулерін елемеңіз.","options":["Хат IT қызметінен келгендей болғандықтан бағдарламаны орнату.","Алдымен әріптесінен орнатуды сұрау.","Орнатпау; сұрауды таныс IT қолдау арнасы арқылы тексеру."],"explanation":"Таныс жіберуші бағдарламаны орнатуға рұқсат берілгенін білдірмейді. Қауіпсіздік ескертулерін елемеу туралы өтінішті бөлек тексеру керек."}}},{"id":"f1p","pool":"finance","risk":true,"key":1,"text":{"en":{"subject":"New supplier bank details","sender":"Supplier Accounts <accounts@supplier.example>","context":"You have paid this supplier before, but their bank details have never changed.","body":"Please use our new account for today’s payment. Reply to this email if you need confirmation.","options":["Pay immediately because it is a known supplier.","Confirm the change through the previously recorded supplier contact and approval process.","Reply to this same message and accept any confirmation."],"explanation":"Use an independent, already known contact to verify changed payment details. A reply to the same conversation may reach whoever sent the unusual request."},"ru":{"subject":"Новые банковские реквизиты поставщика","sender":"Бухгалтерия поставщика <accounts@supplier.example>","context":"Вы уже платили этому поставщику, но его банковские реквизиты раньше не менялись.","body":"Используйте наш новый счёт для сегодняшнего платежа. Для подтверждения ответьте на это письмо.","options":["Сразу заплатить, потому что поставщик знакомый.","Подтвердить изменение по ранее сохранённому контакту поставщика и соблюсти порядок согласования.","Ответить в этой же переписке и принять любое подтверждение."],"explanation":"Изменённые реквизиты проверяйте через независимый, ранее известный контакт. Ответ в той же переписке может получить тот, кто отправил необычную просьбу."},"kk":{"subject":"Жеткізушінің жаңа банк деректемелері","sender":"Жеткізушінің бухгалтериясы <accounts@supplier.example>","context":"Сіз бұл жеткізушіге бұрын төлем жасағансыз, бірақ оның банк деректемелері ешқашан өзгермеген.","body":"Бүгінгі төлем үшін жаңа шотымызды пайдаланыңыз. Растау қажет болса, осы хатқа жауап беріңіз.","options":["Жеткізуші таныс болғандықтан бірден төлеу.","Өзгерісті жеткізушінің бұрын сақталған байланысы арқылы растап, келісу тәртібін сақтау.","Осы хатқа жауап беріп, кез келген растауды қабылдау."],"explanation":"Өзгерген төлем деректемелерін бұрыннан белгілі, тәуелсіз байланыс арқылы тексеріңіз. Сол хат алмасуға жауап берсеңіз, жауап ерекше сұрауды жіберген адамның өзіне баруы мүмкін."}}},{"id":"f2p","pool":"finance","risk":false,"key":0,"text":{"en":{"subject":"Monthly reconciliation ready","sender":"Finance Team <finance@campus.example>","context":"You expected this monthly task. No new bank details, attachments or external links are included.","body":"The reconciliation is ready in our approved finance portal. Please review it during the normal reporting cycle.","options":["Open the saved finance portal and review the expected task.","Send a password so the sender can open it for you.","Report it automatically because it involves finance."],"explanation":"The task matches your established workflow and does not request secrets. Check it in the familiar portal."},"ru":{"subject":"Ежемесячная сверка готова","sender":"Финансовый отдел <finance@campus.example>","context":"Вы ожидали эту ежемесячную задачу. В письме нет новых реквизитов, вложений или внешних ссылок.","body":"Сверка готова на утверждённом финансовом портале. Проверьте её в рамках обычного отчётного периода.","options":["Открыть сохранённый финансовый портал и проверить ожидаемую задачу.","Отправить пароль, чтобы отправитель открыл документы за вас.","Автоматически сообщить о фишинге, потому что письмо связано с финансами."],"explanation":"Задача соответствует вашему рабочему процессу и не требует секретных сведений. Проверьте её на знакомом портале."},"kk":{"subject":"Ай сайынғы салыстырып тексеру дайын","sender":"Қаржы бөлімі <finance@campus.example>","context":"Сіз бұл ай сайынғы тапсырманы күткенсіз. Жаңа банк деректемелері, тіркемелер немесе сыртқы сілтемелер жоқ.","body":"Салыстырып тексеру бекітілген қаржы порталында дайын. Оны әдеттегі есепті кезеңде қарап шығыңыз.","options":["Сақталған қаржы порталын ашып, күтілген тапсырманы тексеру.","Жіберуші құжаттарды сіз үшін ашуы үшін құпиясөз жіберу.","Қаржыға қатысты болғандықтан хатты автоматты түрде фишинг деп хабарлау."],"explanation":"Тапсырма қалыптасқан жұмыс тәртібіне сәйкес келеді және құпия мәліметтерді сұрамайды. Оны таныс порталдан тексеріңіз."}}},{"id":"f3p","pool":"finance","risk":true,"key":2,"text":{"en":{"subject":"Send the payroll file","sender":"Senior Office <director@campus.example>","context":"Payroll exports require approval and a secure internal transfer route.","body":"Please send the complete payroll file to my private address. I need it urgently and the usual approval can wait.","options":["Send it because the sender seems senior.","Upload it publicly and send a link.","Confirm the request separately and keep the approved payroll transfer process."],"explanation":"Seniority and urgency do not remove information-handling requirements. Verify the request and use the approved process."},"ru":{"subject":"Пришлите зарплатную ведомость","sender":"Руководство <director@campus.example>","context":"Выгрузка зарплатных данных требует согласования и защищённого внутреннего канала передачи.","body":"Срочно отправьте полную зарплатную ведомость на мою личную почту. Обычное согласование может подождать.","options":["Отправить файл, потому что запрос якобы пришёл от руководителя.","Выложить файл в открытый доступ и отправить ссылку.","Проверить запрос отдельно и соблюсти утверждённый порядок передачи зарплатных данных."],"explanation":"Должность и срочность не отменяют правила работы с информацией. Проверьте запрос и действуйте по утверждённому порядку."},"kk":{"subject":"Жалақы тізімін жіберіңіз","sender":"Басшылық <director@campus.example>","context":"Жалақы деректерін сыртқа шығару үшін келісім және қорғалған ішкі тасымалдау арнасы қажет.","body":"Толық жалақы тізімін жеке мекенжайыма шұғыл жіберіңіз. Әдеттегі келісуді кейінге қалдыруға болады.","options":["Жіберуші басшы сияқты көрінгендіктен файлды жіберу.","Файлды ашық жариялап, сілтемесін жіберу.","Сұрауды бөлек растап, жалақы деректерін берудің бекітілген тәртібін сақтау."],"explanation":"Лауазым мен шұғылдық ақпаратпен жұмыс істеу талаптарын жоймайды. Сұрауды тексеріп, бекітілген тәртіпті қолданыңыз."}}},{"id":"z1","pool":"shared","risk":true,"key":1,"text":{"en":{"subject":"Help us finish your support ticket","sender":"IT Helpdesk <support@campus.example>","context":"You have an open support ticket, but nobody should need you to send your login code by email.","body":"To complete the ticket, reply with the one-time code you have just received.","options":["Send it because the ticket is real.","Do not share the code; check the request using your known support channel.","Send half of the code first."],"explanation":"An existing ticket does not make a request for a login code safe. Do not send codes; verify independently."},"ru":{"subject":"Помогите завершить вашу заявку в поддержку","sender":"IT-поддержка <support@campus.example>","context":"У вас есть открытая заявка, но для её решения вы не должны отправлять код входа по почте.","body":"Чтобы завершить заявку, пришлите ответным письмом только что полученный одноразовый код.","options":["Отправить код, потому что заявка действительно существует.","Не передавать код; проверить запрос через известный канал поддержки.","Сначала отправить половину кода."],"explanation":"Существующая заявка не делает запрос кода входа безопасным. Не отправляйте коды; проверяйте такие просьбы не async function api(path,method='GET',data=null,secret=teacher){const response=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+secret},body:data===null?undefined:JSON.stringify(data),cache:'no-store',signal:AbortSignal.timeout(8500)});if(!response.ok)throw Error(String(response.status));return response.json()}async function refresh(quiet=false){try{const v=await api('inbox');remote=v.records.filter(safeRecord);if(!quiet)render(false)}catch(e){notice(t('err'))}}async function send(r){if(!net||!room||busy)return;busy=true;if(view==='detail')render(false);try{const v=await api('submit','POST',r,room);if(v.receipt!==r.id)throw Error('receipt');st.delivered[r.id]=v.receipt;save()}catch(e){notice(t('pending'))}finally{busy=false;if(view==='detail')render(false)}}
function pick(pool,risk,n,excluded,seen){const a=shuffle(BANK.filter(q=>q.pool===pool&&q.risk===risk&&!excluded.has(q.id)));a.sort((x,y)=>Number(seen.has(x.id))-Number(seen.has(y.id)));return a.slice(0,n).map(x=>x.id)}function start(parent=null){if(st.draft&&!confirm(t('replace')))return;const old=parent?owned(parent):null;if(parent&&(!old||old.parent||now()<old.end+7*D||st.own.some(x=>x.parent===parent)))return;const code=old?.code||st.alias,role=old?.role||st.role;const seen=new Set(st.own.filter(r=>r.code===code).flatMap(x=>x.answers.map(a=>a.id))),exc=new Set(),items=[];for(const p of (parent?['follow']:['pre','prac','post'])){let pool=p==='prac'?role:p==='follow'?'follow':'shared';for(let id of shuffle([...pick(pool,true,2,exc,seen),...pick(pool,false,2,exc,seen)])){exc.add(id);items.push({id,stage:p,order:shuffle([0,1,2])})}}st.draft={id:uuid(),schema:'CQ2',parent,code,role,start:now(),lang:st.lang,items,pos:0,answers:[],screen:'item',f:null,a:null,hint:false,fb:{use:null,rate:null,confidence:null,frequency:'',comment:''}};view='run';save();render()}

function route(){return `<ol class="route">${['pre','prac','post','follow'].map((s,i)=>`<li><span class="num">0${i+1}</span><div><b>${t(s)}</b><small>${t(s+'D')}</small></div></li>`).join('')}</ol>`}function home(){return `<section class="hero"><div><div class="ey">CYBERLEARN / CAMPUS QUEST</div><h1>${t('hero')}</h1><p>${t('lead')}</p></div>${mapArt}</section><div class="grid"><section class="box"><div class="ey">01 / CAMPUS QUEST</div>${h('choose')}<form id="launch" novalidate><div class="roles">${R.map(k=>`<label class="pick"><input type="radio" name="role" value="${k}" ${st.role===k?'checked':''}><span><b>${t(k)}</b><small>${t(k+'D')}</small></span></label>`).join('')}</div><label class="lab" for="alias">${t('alias')}</label><input class="code" id="alias" name="alias" maxlength="20" pattern="[A-Za-z0-9\\-]{2,20}" value="${E(st.alias)}" required><p class="note">${t('codeHint')}</p><div class="tools gap">${st.draft?btn('resume','resume'):''}<button class="btn ${st.draft?'alt':''}" type="submit">${t(st.draft?'new':'start')} →</button></div></form><p class="note gap">${net&&room?t('live'):t('offline')}</p></section><aside class="box"><div class="ey">02 / ${t('route')}</div>${h('route')}${route()}<hr><span class="tag">${t('bank')} · EN / ҚАЗ / RU</span><p class="note gap">${t('safe')}</p></aside></div>`}

function boxMetric(k,val,desc){return `<div class="metric"><span>${t(k)}</span><b>${E(val)}</b><small>${t(desc)}</small></div>`}function detail(){let r=sourceList(originView).find(x=>x.id===detailId);if(!r)return `<div class="box">${btn('back','nav','',originView)}</div>`;const isOwn=originView==='hist', phase=r.parent?'follow':'post',a=get(r,phase),m=metrics(a),pre=metrics(get(r,'pre')),old=sourceList(originView).find(x=>x.id===r.parent),delta=m.actions-(r.parent?(old?metrics(get(old,'post')).actions:NaN):pre.actions);return `<section class="hero"><div><div class="ey">${t('finished')} / ${E(r.code)}</div><h1>${r.parent?t('follow'):t('fb')}</h1><p>${t(r.role)} · ${dt(r.end)} · ${r.id.slice(-6)}</p></div><div style="justify-self:end" class="ring">${r.parent?'✦':xp(r)+' XP'}</div></section>${isOwn?`<p class="msg ${storageOK?'':'warm'}" role="status">${t(storageOK?'completeSaved':'completeUnsaved')}</p>`:''}${scoreGuide(r)}<div class="box gap"><div class="row"><b>${t(phase)}</b><span class="tag">${t(m.actions===4&&m.ok===4?'badge':m.actions>=2?'badge2':'badge3')}</span></div><div class="metrics">${boxMetric('items',m.actions+'/4','itemsD')}${boxMetric('hit',m.tp+'/'+m.risk,'hitD')}${boxMetric('false',m.fp+'/'+m.safe,'falseD')}${boxMetric('accuracy',pct(m.ok,m.total),'accuracyD')}</div><p><b>${t('miss')}:</b> ${m.risk-m.tp} · <b>${t('delta')}:</b> ${Number.isFinite(delta)?(delta>0?'+':'')+(25*delta)+' '+({ru:'п. п.',en:'pp',kk:'п. т.'}[st.lang]):'—'} ${r.parent?`(${t('pair')}: ${r.parent.slice(-6)})`:`(${pre.actions}/4 → ${m.actions}/4)`}</p><p class="note">${t('brief')}</p></div><div class="box gap"><div class="tools">${btn('json','json')}${btn('csv','csv','alt')}${btn('print','print','alt')}${btn('back','nav','alt',originView)}</div>${isOwn?`${handoffGuide()}<p class="msg ${st.delivered[r.id]?'':'info'}">${st.delivered[r.id]?'✓ '+t('received')+' · '+r.id.slice(-6):net&&room?t(busy?'network':'pending'):t('offline')}</p>${net&&room&&!st.delivered[r.id]&&!busy?btn('send','send','alt'):''}`:''}${!r.parent&&isOwn?`<hr><b>${t('follow')}</b><p class="note">${t('again')}</p><div class="tools gap">${st.own.some(x=>x.parent===r.id)?`<span class="tag">${t('followdone')}</span>`:now()>=r.end+7*D?btn('follow','follow','',r.id):`<span class="pill">${t('lock')}: ${dt(r.end+7*D)}</span>`}${btn('week','ics','alt')}</div>`:''}</div><div class="box gap">${h('review')}${stages(r).map(p=>`<h3 class="gap">${t(p)} · ${metrics(get(r,p)).actions}/4</h3>${get(r,p).map(a=>{let q=dict[a.id],c=txt(a.id);return `<details><summary>${a.a===q.key&&a.f===q.risk?'✓':'↻'} &nbsp;${E(c.subject)}</summary><p>${E(c.body)}</p><p><b>${t('tri')}</b> ${t(a.f?'flag':'routine')} · <b>${t('expected')}:</b> ${t(q.risk?'flag':'routine')}</p><p><b>${t('chosen')}:</b> ${E(c.options[a.a])}</p><p><b>${t('best')}:</b> ${E(c.options[q.key])}</p><p>${E(c.explanation)}</p></details>`}).join('')}`).join('')}<hr><h3>${t('feedback')}</h3><p>${t('rate')}: ${r.fb.rate??'—'} · ${t('use')}: ${r.fb.use??'—'}</p><p>${t('confidence')}: ${r.fb.confidence??'—'} · ${t('frequency')}: ${r.fb.frequency?t(r.fb.frequency):'—'}</p><p>${E(r.fb.comment)||'—'}</p></div>`}
function records(v){let reviewer=v==='teach';if(reviewer&&net&&!teacher)return `<section class="box"><h1>${t('reviewHome')}</h1><p class="sub">${t('locked')}</p></section>`;let full=sourceList(v);const rs=full.filter(r=>(filter==='all'||filter===r.role)&&(!query||(r.code+' '+r.id).toLowerCase().includes(query.toLowerCase())));let fin=full.filter(x=>!x.parent).flatMap(x=>get(x,'post')),m=metrics(fin);return `<div class="row"><div><div class="ey">CAMPUS QUEST / ${t('count')}</div><h1>${t(reviewer?'reviewHome':'hist')}</h1></div><span class="pill">${t('count')}: ${full.length}</span></div><p class="sub">${t(reviewer?(net?'remote':'localrev'):'personal')}</p>${reviewer?`<div class="metrics">${boxMetric('hit',m.tp+'/'+m.risk,'hitD')}${boxMetric('false',m.fp+'/'+m.safe,'falseD')}${boxMetric('accuracy',pct(m.ok,m.total),'accuracyD')}</div>`:''}<div class="box gap"><div class="tools">${reviewer?`<label class="btn alt">↑ ${t('import')}<input type="file" id="import" accept=".json,application/json" multiple style="max-width:1px;opacity:0"></label>${net?btn('refresh','refresh','alt'):''}`:''}${btn('export','exports','alt','',chosen.size?'':'disabled')}${btn('remove','delete','bad','',chosen.size?'':'disabled')}<small id="selcount">${t('only')}: ${chosen.size}</small></div>${importMsg?`<p class="msg info">${E(importMsg)}</p>`:''}<div class="split gap"><input class="field" id="search" type="search" value="${E(query)}" aria-label="${t('search')}" placeholder="${t('search')}"><select class="field" id="filter" aria-label="${t('role')}">${['all',...R].map(k=>`<option value="${k}" ${k===filter?'selected':''}>${t(k)}</option>`).join('')}</select></div>${rs.length?`<div class="tabwrap gap"><table><thead><tr><th>${t('select')}</th><th>${t('code')}</th><th>${t('date')}</th><th>${t('role')}</th><th>${t('type')}</th><th>${t('items')}</th><th>${t('review')}</th></tr></thead><tbody>${rs.map(r=>`<tr><td><input type="checkbox" data-id="${r.id}" aria-label="${t('select')} ${E(r.code)} ${r.id.slice(-6)}" ${chosen.has(r.id)?'checked':''}></td><td><b>${E(r.code)}</b><br><small>${r.id.slice(-6)}</small></td><td>${dt(r.end)}</td><td>${t(r.role)}</td><td>${t(r.parent?'follow':'post')}</td><td>${metrics(get(r,r.parent?'follow':'post')).actions}/4</td><td>${btn('show','open','alt',r.id)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="sub">${t('none')}</p>`}</div>`}
function help(){return `<div class="box"><div class="ey">CAMPUS QUEST / 2.2.0</div><h1>${t('help')}</h1>${route()}<hr><p>${t('method')}</p><p class="sub">${t('again')}</p><p class="sub">${t('private')}</p><p class="sub">${t(net&&room?'live':'offline')}</p><hr>${h('helpSources')}<p><a href="https://consumer.ftc.gov/articles/how-recognize-avoid-phishing-scams" target="_blank" rel="noopener noreferrer">FTC · Phishing</a> &nbsp; <a href="https://csrc.nist.gov/pubs/sp/800/50/r1/final" target="_blank" rel="noopener noreferrer">NIST SP 800-50 Rev. 1</a></p></div>`}
Object.assign(UI,{codeError:['Use 2–20 letters (A–Z), digits or hyphens. For example: STAFF-01.','Введите 2–20 латинских букв, цифр или дефисов. Например: STAFF-01.','2–20 латын әрпін, цифр немесе дефис енгізіңіз. Мысалы: STAFF-01.'],inboxLabel:['INBOX','ВХОДЯЩИЕ','КІРІС ХАТТАР']});
function fieldError(msg,node){const f=node.closest('form');let p=f.querySelector('.formerr');if(!p){p=document.createElement('p');p.className='formerr msg warm';p.id='field-error';p.setAttribute('role','alert');f.appendChild(p)}p.textContent=msg;node.setAttribute('aria-invalid','true');node.setAttribute('aria-describedby',p.id);node.focus();}
function render(top=true){document.title='CyberLearn · '+t('home');document.documentElement.lang=st.lang;let active=view==='run'?'home':view==='detail'?originView:view;$('#header').innerHTML=`<div class="wrap top"><div class="logo"><span class="sig">⌁</span>CyberLearn</div><nav>${['home','hist','teach','help'].map(v=>`<button data-a="nav" data-v="${v}" class="navbtn" ${active===v?'aria-current="page"':''}>${t(v)}</button>`).join('')}</nav><select id="lang" aria-label="Language / Язык / Тіл">${['ru','kk','en'].map(k=>`<option value="${k}" ${st.lang===k?'selected':''}>${{ru:'Русский',kk:'Қазақша',en:'English'}[k]}</option>`).join('')}</select></div>`;$('#main').innerHTML=(!storageOK?`<p class="msg warm">${t('storage')}</p>`:'')+(view==='home'?home():view==='run'?progressSummary()+run():view==='detail'?detail():view==='help'?help():records(view))+`<div class="foot"><span>CYBERLEARN / CAMPUS QUEST &nbsp; 2.2.0</span><span>CS-2421 · EN / ҚАЗ / RU</span></div>`;$('.skip').textContent={ru:'К содержимому',kk:'Мазмұнға өту',en:'Skip to content'}[st.lang];if(top){window.scrollTo(0,0);$('#main').focus({preventScroll:true})}}
function nav(v){view=v;chosen.clear();query='';filter='all';importMsg='';render();if(v==='teach'&&net&&teacher)refresh()}function stamp(n){return new Date(n).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}async function ingest(files){let added=0,dups=0,bad=0;for(const f of files){try{if(f.size>2e6)throw 0;let o=JSON.parse(await f.text());if(o.format!=='CyberLearn.CampusQuest/2'||!Array.isArray(o.records)||!o.records.length||o.records.length>300||!o.records.every(safeRecord))throw 0;for(let r of o.records){const prior=sourceList('teach').find(x=>x.id===r.id);if(prior){if(recordFingerprint(prior)!==recordFingerprint(r))throw Error('conflicting record');dups++;continue}if(net){let v=await api('import','POST',r);added+=v.added?1:0;dups+=v.added?0:1;await refresh(true)}else{st.imports.unshift(r);added++}}}catch(e){bad++}}save();importMsg=`${t('added')}: ${added} · ${t('dup')}: ${dups} · ${t('invalid')}: ${bad}`;render(false)}
document.addEventListener('input',e=>{let el=e.target;if(el.id==='alias')st.alias=el.value.trim();if(el.dataset.fb&&st.draft){st.draft.fb[el.dataset.fb]=['comment','frequency'].includes(el.id)?el.value:el.value?Number(el.value):null;save()}if(el.id==='search'){query=el.value;chosen.clear();render(false);$('#search').focus();$('#search').setSelectionRange(query.length,query.length)}});document.addEventListener('change',e=>{let x=e.target,d=st.draft;if(x.id==='lang'){st.lang=x.value;save();render(false)}else if(x.name==='role'){st.role=x.value;save()}else if(x.name==='a'&&d){d.a=Number(x.value);save()}else if(x.name==='f'&&d){d.f=x.value==='1';save()}else if(x.id==='filter'){filter=x.value;chosen.clear();render(false)}else if(x.dataset.id){if(x.checked)chosen.add(x.dataset.id);else chosen.delete(x.dataset.id);render(false)}else if(x.id==='import'){ingest([...x.files])}});document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='launch'){const e=$('#alias');const v=e.value.trim();if(!/^[A-Za-z0-9-]{2,20}$/.test(v))return fieldError(t('codeError'),e);st.alias=v;start()}if(e.target.id==='answer'){const d=st.draft;if(!d||d.answers[d.pos])return;if(d.f===null||d.a===null)return fieldError(t('alert'),document.querySelector(d.f===null?'[name=f]':'[name=a]'));const it=d.items[d.pos];d.answers.push({id:it.id,stage:it.stage,a:d.a,f:d.f});save();render(false);$('.msg:last-of-type')?.scrollIntoView({block:'nearest'})}});
document.addEventListener('click',async e=>{let b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;const d=st.draft,r=sourceList(originView).find(x=>x.id===detailId);if(a==='nav')nav(v);else if(a==='resume'){view='run';render()}else if(a==='enter'&&d){d.screen='item';save();render()}else if(a==='hint'&&d){d.hint=true;save();render(false)}else if(a==='next')advance();else if(a==='finish')finish();else if(a==='open'){originView=view;detailId=v;view='detail';render()}else if(a==='json'&&r)outJSON([r]);else if(a==='csv'&&r)outCSV([r]);else if(a==='print')window.print();else if(a==='follow')start(v);else if(a==='send'&&r)send(r);else if(a==='refresh')refresh();else if(a==='exports')outCSV(sourceList(view).filter(x=>chosen.has(x.id)));else if(a==='ics'&&r){let when=r.end+7*D;filedownload('CyberLearn_day7.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CyberLearn//Quest//EN','BEGIN:VEVENT','UID:'+r.id+'@campusquest.invalid','DTSTAMP:'+stamp(now()),'DTSTART:'+stamp(when),'DTEND:'+stamp(when+15*60000),'SUMMARY:CyberLearn - '+t('follow'),'DESCRIPTION:'+t('again'),'END:VEVENT','END:VCALENDAR',''].join('\r\n'),'text/calendar;charset=utf-8')}else if(a==='delete'&&chosen.size&&confirm(t('sure')+' ('+chosen.size+')')){try{if(view==='teach'&&net){await api('delete','POST',{ids:[...chosen]});await refresh(true)}else if(view==='teach')st.imports=st.imports.filter(r=>!chosen.has(r.id));else{st.own=st.own.filter(r=>!chosen.has(r.id));for(let id of chosen)delete st.delivered[id]}chosen.clear();save();render(false)}catch(e){notice(t('err'))}}});
render(false);(async()=>{if(location.protocol!=='file:'){try{const v=await api('mode','GET',null,'');net=v.mode==='classroom';render(false);if(net&&teacher&&view==='teach')refresh()}catch(e){/* Static hosting: manual file handoff. */}}})();

let printOpened=[];window.addEventListener('beforeprint',()=>{printOpened=[...document.querySelectorAll('details:not([open])')];printOpened.forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>{printOpened.forEach(d=>d.open=false);printOpened=[]});
